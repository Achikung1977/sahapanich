
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ค้นหาห้องพบที่ปรึกษา</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Prompt',sans-serif;
}

body{
  min-height:100vh;
  background:
    linear-gradient(135deg,#0d47a1,#1565c0,#1976d2);
  padding:20px;
}

.container{
  max-width:950px;
  margin:auto;
}

/* =========================
   HEADER
========================= */

.header{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:32px;
  padding:35px 25px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
  margin-bottom:25px;
}

.logo{
  width:120px;
  height:120px;
  object-fit:contain;
  background:white;
  border-radius:50%;
  padding:10px;
  margin-bottom:18px;
  box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

.college-name{
  color:white;
  font-size:22px;
  font-weight:500;
  line-height:1.7;
  margin-bottom:18px;
}

.highlight-title{
  display:inline-block;
  background:white;
  color:#0d47a1;
  padding:14px 30px;
  border-radius:50px;
  font-size:34px;
  font-weight:700;
  box-shadow:0 5px 15px rgba(0,0,0,0.12);
}

/* =========================
   SEARCH
========================= */

.search-section{
  background:white;
  border-radius:28px;
  padding:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  margin-bottom:25px;
}

.search-title{
  text-align:center;
  color:#0d47a1;
  font-size:24px;
  font-weight:600;
  margin-bottom:18px;
}

.search-box{
  position:relative;
}

.search-icon{
  position:absolute;
  left:22px;
  top:50%;
  transform:translateY(-50%);
  font-size:24px;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  background:#f4f7fb;
  border-radius:20px;
  padding:20px 20px 20px 60px;
  font-size:24px;
  transition:0.3s;
}

.search-box input:focus{
  background:white;
  box-shadow:0 0 0 4px rgba(25,118,210,0.15);
}

/* =========================
   WELCOME
========================= */

.welcome-box{
  background:white;
  border-radius:28px;
  padding:50px 20px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.welcome-box h2{
  color:#0d47a1;
  font-size:34px;
  margin-bottom:15px;
}

.welcome-box p{
  color:#666;
  font-size:19px;
  line-height:1.8;
}

/* =========================
   RESULT CARD
========================= */

.result-card{
  background:white;
  border-radius:30px;
  overflow:hidden;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  animation:fadeIn .3s ease;
}

.result-top{
  padding:28px;
}

.student-name{
  color:#0d47a1;
  font-size:34px;
  font-weight:700;
  line-height:1.5;
  margin-bottom:20px;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.info-box{
  background:#f5f8fd;
  border-radius:18px;
  padding:18px;
}

.info-title{
  color:#777;
  font-size:14px;
  margin-bottom:6px;
}

.info-value{
  color:#222;
  font-size:22px;
  font-weight:600;
}

.room-section{
  background:
    linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  text-align:center;
  padding:35px 20px;
}

.room-title{
  font-size:24px;
  margin-bottom:10px;
}

.room-number{
  font-size:90px;
  font-weight:700;
  line-height:1;
}

/* =========================
   EMPTY RESULT
========================= */

.no-data{
  background:white;
  border-radius:28px;
  padding:40px 20px;
  text-align:center;
  color:#666;
  font-size:22px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

/* =========================
   FOOTER
========================= */

.footer{
  margin-top:30px;
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border-radius:28px;
  padding:25px;
  text-align:center;
  color:white;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.footer h3{
  font-size:26px;
  margin-bottom:10px;
}

.footer p{
  font-size:18px;
  opacity:0.95;
}

/* =========================
   ANIMATION
========================= */

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  body{
    padding:15px;
  }

  .header{
    padding:30px 20px;
  }

  .logo{
    width:95px;
    height:95px;
  }

  .college-name{
    font-size:18px;
  }

  .highlight-title{
    font-size:26px;
    padding:12px 22px;
  }

  .search-title{
    font-size:20px;
  }

  .search-box input{
    font-size:16px;
    padding:18px 18px 18px 55px;
  }

  .welcome-box{
    padding:40px 20px;
  }

  .welcome-box h2{
    font-size:28px;
  }

  .welcome-box p{
    font-size:17px;
  }

  .student-name{
    font-size:28px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .info-value{
    font-size:20px;
  }

  .room-number{
    font-size:72px;
  }

  .footer h3{
    font-size:22px;
  }

  .footer p{
    font-size:16px;
  }

}

</style>
</head>
<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <img
      class="logo"
      src="https://saha.ac.th/wp-content/uploads/2020/07/logo-1-150x150.png"
      alt="logo"
    >

    <div class="college-name">
      วิทยาลัยเทคโนโลยีสหะพาณิชย์บริหารธุรกิจ
    </div>

    <div class="highlight-title">
      ค้นหาห้องพบที่ปรึกษา
    </div>

  </div>

  <!-- SEARCH -->

  <div class="search-section">

    <div class="search-title">
      ค้นหาข้อมูลนักศึกษา
    </div>

    <div class="search-box">

      <div class="search-icon">
        🔍
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="ค้นหา รหัสนักศึกษา / ชื่อ / นามสกุล / ระดับชั้น"
      >

    </div>

  </div>

  <!-- WELCOME -->

  <div id="welcomeBox" class="welcome-box">

    <h2>
      ยินดีต้อนรับ
    </h2>

    <p>
      กรุณาค้นหาข้อมูลนักศึกษา<br>
      เพื่อแสดงห้องพบที่ปรึกษา
    </p>

  </div>

  <!-- RESULT -->

  <div id="results"></div>

  <!-- FOOTER -->

  <div class="footer">

    <h3>
      ยินดีต้อนรับนักเรียนนักศึกษาใหม่
    </h3>

    <p>
      เข้าเรียนต้นปีการศึกษา 2569
    </p>

  </div>

</div>

<script>

/* =========================
   ใส่ URL Apps Script ของคุณ
========================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbztvZ1juJKSGN9-RVj2qzfMTC_wvhOfizanlTqG_M1eZ9m0SWAe7wUAyaJnankQcIkX/exec";

const searchInput = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");
const welcomeBox = document.getElementById("welcomeBox");

let students = [];

/* =========================
   โหลดข้อมูล
========================= */

async function loadData(){

  try{

    const response = await fetch(API_URL);

    students = await response.json();

    console.log("โหลดข้อมูลสำเร็จ", students);

  }catch(error){

    console.error(error);

    welcomeBox.innerHTML = `
      <div class="no-data">
        ไม่สามารถโหลดข้อมูลได้
      </div>
    `;

  }

}

/* =========================
   แสดงผล
========================= */

function showResults(data){

  if(data.length === 0){

    resultsDiv.innerHTML = `
      <div class="no-data">
        ไม่พบข้อมูลที่ค้นหา
      </div>
    `;

    return;
  }

  resultsDiv.innerHTML = data.map(student => `

    <div class="result-card">

      <div class="result-top">

        <div class="student-name">
          ${student.prefix || ""}${student.firstname || ""} ${student.lastname || ""}
        </div>

        <div class="info-grid">

          <div class="info-box">
            <div class="info-title">
              รหัสนักศึกษา
            </div>
            <div class="info-value">
              ${student.studentId || "-"}
            </div>
          </div>

          <div class="info-box">
            <div class="info-title">
              ชื่อเล่น
            </div>
            <div class="info-value">
              ${student.nickname || "-"}
            </div>
          </div>

          <div class="info-box">
            <div class="info-title">
              ระดับชั้น
            </div>
            <div class="info-value">
              ${student.classLevel || "-"}
            </div>
          </div>

        </div>

      </div>

      <div class="room-section">

        <div class="room-title">
          ห้องพบที่ปรึกษา
        </div>

        <div class="room-number">
          ${student.room || "-"}
        </div>

      </div>

    </div>

  `).join("");

}

/* =========================
   ค้นหา
========================= */

searchInput.addEventListener("keyup", function(){

  const keyword = this.value.trim().toLowerCase();

  // ยังไม่ค้นหา
  if(keyword === ""){

    resultsDiv.innerHTML = "";

    welcomeBox.style.display = "block";

    return;
  }

  // ซ่อน welcome
  welcomeBox.style.display = "none";

  const filtered = students.filter(student => {

    const studentId =
      String(student.studentId || "").toLowerCase();

    const firstname =
      String(student.firstname || "").toLowerCase();

    const lastname =
      String(student.lastname || "").toLowerCase();

    const nickname =
      String(student.nickname || "").toLowerCase();

    const classLevel =
      String(student.classLevel || "").toLowerCase();

    return (

      studentId.includes(keyword) ||
      firstname.includes(keyword) ||
      lastname.includes(keyword) ||
      nickname.includes(keyword) ||
      classLevel.includes(keyword)

    );

  });

  showResults(filtered);

});

/* =========================
   เริ่มโหลดข้อมูล
========================= */

loadData();

</script>

</body>
</html>
