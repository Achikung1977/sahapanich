<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>ค้นหาห้องพบที่ปรึกษา</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Prompt',sans-serif;
}

body{
  background:
    linear-gradient(135deg,#0d47a1 0%,#1565c0 50%,#1976d2 100%);
  min-height:100vh;
  padding:20px;
  color:#222;
}

.container{
  max-width:900px;
  margin:auto;
}

.header{
  background:rgba(255,255,255,0.12);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:30px;
  padding:30px 25px;
  text-align:center;
  margin-bottom:25px;
  box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.logo{
  width:110px;
  height:110px;
  object-fit:contain;
  margin-bottom:15px;
  background:white;
  border-radius:50%;
  padding:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.header h1{
  color:white;
  font-size:36px;
  font-weight:700;
  margin-bottom:10px;
}

.header p{
  color:rgba(255,255,255,0.92);
  font-size:18px;
  line-height:1.6;
}

.search-section{
  background:white;
  border-radius:28px;
  padding:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  margin-bottom:25px;
}

.search-box{
  position:relative;
}

.search-box input{
  width:100%;
  border:none;
  outline:none;
  background:#f4f7fb;
  padding:20px 20px 20px 60px;
  border-radius:20px;
  font-size:18px;
  color:#222;
  transition:0.3s;
}

.search-box input:focus{
  background:white;
  box-shadow:0 0 0 4px rgba(25,118,210,0.15);
}

.search-icon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  font-size:22px;
  color:#1565c0;
}

.search-note{
  margin-top:12px;
  text-align:center;
  color:#666;
  font-size:15px;
}

#welcome{
  background:white;
  border-radius:30px;
  padding:50px 25px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

#welcome h2{
  font-size:32px;
  color:#0d47a1;
  margin-bottom:10px;
}

#welcome p{
  color:#666;
  font-size:18px;
  line-height:1.8;
}

.result-card{
  background:white;
  border-radius:30px;
  overflow:hidden;
  margin-bottom:25px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  animation:fadeIn .3s ease;
}

.card-top{
  padding:30px;
}

.student-name{
  font-size:34px;
  font-weight:700;
  color:#0d47a1;
  margin-bottom:20px;
  line-height:1.4;
}

.info-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.info-box{
  background:#f5f8fd;
  border-radius:18px;
  padding:18px;
}

.info-title{
  font-size:14px;
  color:#777;
  margin-bottom:5px;
}

.info-value{
  font-size:22px;
  font-weight:600;
  color:#222;
}

.room-section{
  background:
    linear-gradient(135deg,#0d47a1,#1976d2);
  color:white;
  text-align:center;
  padding:35px 20px;
}

.room-title{
  font-size:24px;
  margin-bottom:10px;
}

.room-number{
  font-size:90px;
  font-weight:700;
  line-height:1;
}

.no-data{
  background:white;
  border-radius:25px;
  padding:40px 20px;
  text-align:center;
  color:#777;
  font-size:22px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
}

.footer{
  text-align:center;
  color:white;
  margin-top:25px;
  font-size:14px;
  opacity:0.9;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:768px){

  body{
    padding:15px;
  }

  .header{
    padding:25px 20px;
  }

  .logo{
    width:90px;
    height:90px;
  }

  .header h1{
    font-size:28px;
  }

  .header p{
    font-size:16px;
  }

  .search-box input{
    font-size:16px;
    padding:18px 18px 18px 55px;
  }

  #welcome{
    padding:40px 20px;
  }

  #welcome h2{
    font-size:26px;
  }

  #welcome p{
    font-size:16px;
  }

  .card-top{
    padding:22px;
  }

  .student-name{
    font-size:28px;
  }

  .info-grid{
    grid-template-columns:1fr;
  }

  .info-value{
    font-size:20px;
  }

  .room-title{
    font-size:22px;
  }

  .room-number{
    font-size:72px;
  }

}

</style>
</head>
<body>

<div class="container">

  <div class="header">

    <img
      class="logo"
      src="https://saha.ac.th/wp-content/uploads/2020/07/logo-1-150x150.png"
      alt="logo"
    >

    <h1>ค้นหาห้องพบที่ปรึกษา</h1>

    <p>
      วิทยาลัยเทคโนโลยีสหะพาณิชย์บริหารธุรกิจ
    </p>

  </div>

  <div class="search-section">

    <div class="search-box">

      <div class="search-icon">
        🔍
      </div>

      <input
        type="text"
        id="searchInput"
        placeholder="ค้นหา รหัสนักศึกษา / ชื่อ / นามสกุล / ระดับชั้น"
      >

    </div>

    <div class="search-note">
      สามารถค้นหาได้จาก รหัสนักศึกษา ชื่อ นามสกุล และระดับชั้น
    </div>

  </div>

  <div id="welcome">

    <h2>ค้นหาข้อมูลนักศึกษา</h2>

    <p>
      กรุณากรอกข้อมูลในช่องค้นหา<br>
      เพื่อแสดงห้องพบที่ปรึกษา
    </p>

  </div>

  <div id="results"></div>

  <div class="footer">
    รองรับการใช้งานบนมือถือและ GitHub Pages
  </div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbztvZ1juJKSGN9-RVj2qzfMTC_wvhOfizanlTqG_M1eZ9m0SWAe7wUAyaJnankQcIkX/exec";

const searchInput = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");
const welcomeDiv = document.getElementById("welcome");

let students = [];

async function loadData(){

  try{

    const response = await fetch(API_URL);
    students = await response.json();

  }catch(error){

    welcomeDiv.innerHTML = `
      <div class="no-data">
        ไม่สามารถโหลดข้อมูลได้
      </div>
    `;

    console.error(error);
  }

}

function showResults(data){

  if(data.length === 0){

    resultsDiv.innerHTML = `
      <div class="no-data">
        ไม่พบข้อมูลที่ค้นหา
      </div>
    `;

    return;
  }

  resultsDiv.innerHTML = data.map(student => `

    <div class="result-card">

      <div class="card-top">

        <div class="student-name">
          ${student.prefix}${student.firstname} ${student.lastname}
        </div>

        <div class="info-grid">

          <div class="info-box">
            <div class="info-title">
              รหัสนักศึกษา
            </div>
            <div class="info-value">
              ${student.studentId}
            </div>
          </div>

          <div class="info-box">
            <div class="info-title">
              ชื่อเล่น
            </div>
            <div class="info-value">
              ${student.nickname}
            </div>
          </div>

          <div class="info-box">
            <div class="info-title">
              ระดับชั้น
            </div>
            <div class="info-value">
              ${student.classLevel}
            </div>
          </div>

        </div>

      </div>

      <div class="room-section">

        <div class="room-title">
          ห้องพบที่ปรึกษา
        </div>

        <div class="room-number">
          ${student.room}
        </div>

      </div>

    </div>

  `).join("");

}

searchInput.addEventListener("keyup", function(){

  const keyword = this.value.trim().toLowerCase();

  if(keyword === ""){

    resultsDiv.innerHTML = "";
    welcomeDiv.style.display = "block";
    return;

  }

  welcomeDiv.style.display = "none";

  const filtered = students.filter(student =>

    student.studentId.toLowerCase().includes(keyword) ||

    student.firstname.toLowerCase().includes(keyword) ||

    student.lastname.toLowerCase().includes(keyword) ||

    student.classLevel.toLowerCase().includes(keyword)

  );

  showResults(filtered);

});

loadData();

</script>

</body>
</html>
